apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: registry.access.redhat.com/ubi9/ubi:latest
          command: ["sleep", "infinity"]
          envFrom:
            - configMapRef:
                name: db-config



